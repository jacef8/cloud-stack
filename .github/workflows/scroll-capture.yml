name: Build Scroll Capture

# Builds the Android app whenever it changes (or on demand from the Actions tab)
# and publishes the APK, so installing is: open the release on your phone, tap the .apk.
on:
  push:
    paths:
      - 'scroll-capture/**'
      - '.github/workflows/scroll-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

# Builds take turns, so two pushes close together cannot clash while publishing.
concurrency:
  group: scroll-capture-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scroll-capture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ScrollCapture.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScrollCapture-apk
          path: scroll-capture/ScrollCapture.apk

      # Two releases per build:
      #  - scroll-capture-latest: always the newest build, at a fixed address (for a quick manual download).
      #  - scroll-capture-v1.0.N: this build under its own version number, so an updater app (Obtainium) can
      #    see that a NEW version exists and install it by itself. Only the latest five are kept.
      - name: Publish the newest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NOTES="Build ${{ github.run_number }} (version $VERSION) from ${GITHUB_SHA::7} on ${{ github.ref_name }}."

          gh release delete scroll-capture-latest --yes --cleanup-tag || true
          gh release create scroll-capture-latest ScrollCapture.apk \
            --title "Scroll Capture build ${{ github.run_number }}" \
            --notes "$NOTES Open on your phone and tap ScrollCapture.apk to install or update." \
            --prerelease \
            --target "$GITHUB_SHA"

          gh release create "scroll-capture-v$VERSION" ScrollCapture.apk \
            --title "Scroll Capture $VERSION" \
            --notes "$NOTES" \
            --latest \
            --target "$GITHUB_SHA"

          # Keep the newest five numbered releases; remove older ones and their tags.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("scroll-capture-v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done

name: Deploy Record Room

# Deploys whatever was just pushed, from master or from a working branch.
# No pull request, no merge step: the branch that gets pushed is the branch
# that ships, so an update is one push and nothing else.
on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'samples/record-room.html'
      - 'samples/tools/build-site.js'
      - 'public/vendor/**'
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-record-room
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the site
        run: |
          npm run build:site
          ls -l public/

      - name: Check the build before shipping it
        run: |
          node - <<'CHECK'
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const must=[['doctype','<!doctype html>'],['title','<title>Record Room</title>'],
                      ['viewport','name="viewport"'],['league id','LEAGUE_ID'],['history','HIST='],
                      ['manifest','manifest.webmanifest'],['service worker','/sw.js'],
                      ['lenis','/vendor/lenis.min.js'],['ambient','/vendor/ambient.js']];
          for(const f of ['manifest.webmanifest','sw.js','icon-192.png','icon-512.png',
                          'apple-touch-icon.png','vendor/lenis.min.js','vendor/smooth.js',
                          'vendor/ambient.js','vendor/three.module.min.js']){
            if(!fs.existsSync('public/'+f)){console.error('::error::Missing public/'+f);process.exit(1);}
          }
          // An icon with transparent or white corners gets a black fill on iOS
          // and a white plate on Android, so the deploy refuses one.
          const zlib=require('zlib');
          for(const f of ['icon-192.png','icon-512.png','apple-touch-icon.png']){
            const d=fs.readFileSync('public/'+f);let pos=8,idat=[],ct=null;
            while(pos<d.length){const ln=d.readUInt32BE(pos),t=d.toString('ascii',pos+4,pos+8);
              if(t==='IHDR')ct=d[pos+8+9];
              if(t==='IDAT')idat.push(d.subarray(pos+8,pos+8+ln));
              pos+=12+ln;}
            if(ct===6){
              const raw=zlib.inflateSync(Buffer.concat(idat));
              if(raw[4]!==255){console.error('::error::'+f+' has a transparent corner');process.exit(1);}
            }
          }
          const missing=must.filter(([,n])=>!html.includes(n)).map(([name])=>name);
          if(missing.length){console.error('::error::Build is missing: '+missing.join(', '));process.exit(1);}
          if(html.length<50000){console.error('::error::Build looks truncated: '+html.length+' bytes');process.exit(1);}
          console.log('build ok, '+html.length+' bytes');
          CHECK

      - name: Write the service account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is not set. See samples/SETUP.md."
            exit 1
          fi
          printf '%s' "$KEY" > "$HOME/key.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/key.json','utf8'))" \
            || { echo "::error::The secret is not valid JSON. Paste the whole file, braces included."; exit 1; }

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/key.json
        run: |
          npm install -g firebase-tools@13
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync(process.env.HOME+'/key.json','utf8')).project_id || ''")
          if [ -z "$PROJECT" ]; then
            PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          fi
          SITE=$(node -p "JSON.parse(require('fs').readFileSync('firebase.json','utf8')).hosting.site")
          echo "Deploying $SITE to project $PROJECT from ${GITHUB_REF#refs/heads/}"
          firebase hosting:sites:create "$SITE" --project "$PROJECT" || true
          firebase deploy --only hosting --project "$PROJECT" --non-interactive
          echo "Live at https://$SITE.web.app"

      - name: Confirm the site is serving
        run: |
          SITE=$(node -p "JSON.parse(require('fs').readFileSync('firebase.json','utf8')).hosting.site")
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/live.html -w '%{http_code}' "https://$SITE.web.app" || echo 000)
            if [ "$CODE" = "200" ] && grep -q "<title>Record Room</title>" /tmp/live.html; then
              echo "Serving: https://$SITE.web.app"; exit 0
            fi
            echo "attempt $i: HTTP $CODE, waiting"; sleep 10
          done
          echo "::error::Deployed, but the site did not serve a Record Room page."
          exit 1

      - name: Clean up
        if: always()
        run: rm -f "$HOME/key.json"
